[workspace]
resolver = "3"
members = ["desktop/app", "desktop/core", "desktop/shm", "desktop/vcam"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Android phone as a USB webcam, microphone and macropad for Windows"
repository = "https://github.com/ExRyuske/Escanor"
license = "GPL-3.0-or-later"

[workspace.dependencies]
escanor-core = { path = "desktop/core" }
escanor-shm = { path = "desktop/shm" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
cpal = "0.18"
base64 = "0.23"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rfd = "0.17"
tray-icon = { version = "0.25", default-features = false }
ureq = { version = "3", features = ["json"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
embed-resource = "3"
iced = { version = "0.14", features = ["image", "tokio"] }
windows = "0.62"
windows-core = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
